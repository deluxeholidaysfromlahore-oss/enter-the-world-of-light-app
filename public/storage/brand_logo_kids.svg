<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="auto">
  <defs>
    <linearGradient id="kidsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="kidsSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <filter id="kidsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Card Background with Rounded Corners -->
  <rect width="800" height="220" rx="20" fill="url(#kidsBg)" />

  <!-- Playful Bubbles -->
  <circle cx="730" cy="40" r="70" fill="#ffffff" opacity="0.1" />
  <circle cx="70" cy="180" r="60" fill="#ffffff" opacity="0.1" />
  <circle cx="680" cy="160" r="35" fill="#fef08a" opacity="0.2" />

  <!-- Left: Playful Smiling Sun Icon -->
  <g transform="translate(100, 110)" filter="url(#kidsGlow)">
    <!-- Sunrays -->
    <g stroke="#fef08a" stroke-width="4.5" stroke-linecap="round" opacity="0.95">
      <line x1="0" y1="-56" x2="0" y2="-44" />
      <line x1="0" y1="44" x2="0" y2="56" />
      <line x1="-56" y1="0" x2="-44" y2="0" />
      <line x1="44" y1="0" x2="56" y2="0" />
      <line x1="-40" y1="-40" x2="-30" y2="-30" />
      <line x1="30" y1="30" x2="40" y2="40" />
      <line x1="-40" y1="40" x2="-30" y2="30" />
      <line x1="30" y1="-40" x2="40" y2="-30" />
    </g>

    <circle cx="0" cy="0" r="36" fill="url(#kidsSun)" />
    <!-- Joyful Eyes & Smile -->
    <circle cx="-12" cy="-6" r="4" fill="#0f172a" />
    <circle cx="12" cy="-6" r="4" fill="#0f172a" />
    <path d="M-14 8 C-7 20 7 20 14 8" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <!-- Cheeks -->
    <circle cx="-20" cy="8" r="5" fill="#f87171" opacity="0.6" />
    <circle cx="20" cy="8" r="5" fill="#f87171" opacity="0.6" />
  </g>

  <!-- Right Side: Kids Typography -->
  <g transform="translate(200, 0)">
    <!-- Badge -->
    <rect x="0" y="32" width="260" height="26" rx="13" fill="#fef3c7" opacity="0.95" />
    <text x="130" y="49" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#b45309" text-anchor="middle" letter-spacing="1">🧸 KIDS LIGHT &amp; LAUGHTER WORLD</text>

    <!-- Main Title -->
    <text x="0" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff">
      Enter the World of <tspan fill="#fef08a">Light</tspan> &amp; <tspan fill="#fed7aa">Laughter</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#fef08a">
      Pixar 3D Stories • Animal Adventures • Moral Tales • Fun ABC &amp; Urdu
    </text>

    <!-- Tagline -->
    <text x="0" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#fef3c7">
      Watch Animated Shorts • Read Bedtime Tales • Safe Learning Channel 2026
    </text>
  </g>
</svg>
