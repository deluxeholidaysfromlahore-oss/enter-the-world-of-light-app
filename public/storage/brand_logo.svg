<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="auto">
  <defs>
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Card Background with Rounded Corners -->
  <rect width="800" height="220" rx="20" fill="url(#headerBg)" />

  <!-- Ambient Light Orbs -->
  <circle cx="740" cy="40" r="90" fill="#ffffff" opacity="0.07" />
  <circle cx="60" cy="180" r="70" fill="#ffffff" opacity="0.06" />

  <!-- Left Side: Radiant Sunburst & Book Logo -->
  <g transform="translate(100, 110)" filter="url(#softGlow)">
    <!-- Sunrays -->
    <g stroke="#fde047" stroke-width="4" stroke-linecap="round" opacity="0.95">
      <line x1="0" y1="-56" x2="0" y2="-44" />
      <line x1="0" y1="44" x2="0" y2="56" />
      <line x1="-56" y1="0" x2="-44" y2="0" />
      <line x1="44" y1="0" x2="56" y2="0" />
      <line x1="-40" y1="-40" x2="-30" y2="-30" />
      <line x1="30" y1="30" x2="40" y2="40" />
      <line x1="-40" y1="40" x2="-30" y2="30" />
      <line x1="30" y1="-40" x2="40" y2="-30" />
    </g>

    <!-- Sun Corona -->
    <circle cx="0" cy="0" r="36" fill="url(#sunGrad)" />
    <circle cx="0" cy="0" r="28" fill="#fbbf24" />

    <!-- Open Book Motif -->
    <path d="M-22 12 C-12 4 -4 5 0 9 C4 5 12 4 22 12 C16 20 6 19 0 16 C-6 19 -16 20 -22 12 Z" fill="#ffffff" opacity="0.98" />

    <!-- Joyful Laughter Smile Arc -->
    <path d="M-10 -2 C-7 5 7 5 10 -2" stroke="#0f172a" stroke-width="3" stroke-linecap="round" fill="none" />
    <circle cx="0" cy="-14" r="3" fill="#ffffff" />
  </g>

  <!-- Right Side: Brand Typography & Slogan -->
  <g transform="translate(200, 0)">
    <!-- Top Pill Badge -->
    <rect x="0" y="32" width="280" height="26" rx="13" fill="#e0f2fe" opacity="0.95" />
    <text x="140" y="49" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#0369a1" text-anchor="middle" letter-spacing="1">✨ OFFICIAL LEARNING &amp; APP HUB</text>

    <!-- Main App Title -->
    <text x="0" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff">
      Enter the World of <tspan fill="#38bdf8">Light</tspan> <tspan fill="#fbbf24">&amp;</tspan> <tspan fill="#f59e0b">Laughter</tspan>
    </text>

    <!-- Subtitle / Mission -->
    <text x="0" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#fde047">
      Bilingual Learning • Urdu Haroof Tracing • Classical Poetry • Kids 3D World
    </text>

    <!-- Secondary Tagline -->
    <text x="0" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#e0f2fe">
      Learn • Play • Practice | Read • Listen • Explore | Safe Screen Time 2026
    </text>
  </g>
</svg>
